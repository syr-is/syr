services:
  # SurrealDB - Multi-model database (Production)
  surrealdb:
    image: surrealdb/surrealdb:v2.6
    user: root
    command: start --log info --user root --pass ${SURREALDB_PASS} file:/data/syr.db
    volumes:
      - surrealdb-prod-data:/data
    environment:
      - SURREAL_LOG=info
    healthcheck:
      test:
        ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  # SeaweedFS - S3-compatible distributed storage (Production)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -s3.port=8333 -volume.max=100
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-prod-data:/data
    environment:
      - WEED_MASTER_VOLUME_GROWTH_COPY_1=2
      - WEED_MASTER_VOLUME_GROWTH_COPY_2=1
      - WEED_MASTER_VOLUME_GROWTH_COPY_OTHER=0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal
    restart: unless-stopped

  # SYR Application (Production)
  syr-prod:
    build:
      context: .
      dockerfile: docker/prod/syr.dockerfile
      args:
        - PUBLIC_URL=${PUBLIC_URL:-https://app.syr.is}
        - PUBLIC_REGISTRY_API_URL=${PUBLIC_REGISTRY_API_URL:-}
    ports:
      - "${PORT:-5173}:${PORT:-5173}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5173}
      - PUBLIC_URL=${PUBLIC_URL:-https://app.syr.is}
      - SURREALDB_URL=${SURREALDB_URL:-ws://surrealdb:8000/rpc}
      - SURREALDB_NAMESPACE=${SURREALDB_NAMESPACE:-syr}
      - SURREALDB_DATABASE=${SURREALDB_DATABASE:-syr}
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://seaweedfs:8333}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-syr-access-key}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET:-syr-storage}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-https://s3.syr.is}
      - S3_CORS_ORIGINS=${S3_CORS_ORIGINS:-https://app.syr.is}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - PLATFORM_DELEGATE_SECRET=${PLATFORM_DELEGATE_SECRET}
      - ARGON2_MEMORY_COST=${ARGON2_MEMORY_COST:-65536}
      - ARGON2_TIME_COST=${ARGON2_TIME_COST:-3}
      - ARGON2_PARALLELISM=${ARGON2_PARALLELISM:-4}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
      - PUBLIC_REGISTRY_API_URL=${PUBLIC_REGISTRY_API_URL:-}
    depends_on:
      surrealdb:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  internal:
    driver: bridge

volumes:
  surrealdb-prod-data:
    driver: local
  seaweedfs-prod-data:
    driver: local
