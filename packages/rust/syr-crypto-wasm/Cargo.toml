[package]
name = "syr-crypto-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM exports for Syr crypto (keys, encoding, sigil, aegis, did)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
syr-crypto-core = { path = "../syr-crypto-core" }
syr-crypto-sigil = { path = "../syr-crypto-sigil" }
syr-crypto-aegis = { path = "../syr-crypto-aegis" }
syr-did = { path = "../syr-did" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
