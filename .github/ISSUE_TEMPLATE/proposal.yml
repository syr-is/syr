name: 💡 Proposal
description: Significant change, refactor, or architectural decision
title: "[Proposal]: "
labels: ["proposal", "discussion"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: Brief description of the proposal
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      placeholder: Why is this needed?
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design
      placeholder: What changes? How would it work?
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      multiple: true
      options:
        - Frontend/UI
        - Backend/API
        - Build/Tooling
        - Docker
        - CI/CD
        - Docs
        - Breaking
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Changes
      options:
        - None
        - Minor
        - Major
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: textarea
    id: drawbacks
    attributes:
      label: Drawbacks / Risks

  - type: textarea
    id: migration
    attributes:
      label: Migration (if breaking)
      placeholder: "(optional)"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Searched for duplicates
          required: true
        - label: Significant change requiring discussion
          required: true
