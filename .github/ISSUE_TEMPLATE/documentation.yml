name: 📚 Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: dropdown
    id: doc-type
    attributes:
      label: Type
      options:
        - Missing
        - Unclear/confusing
        - Incorrect/outdated
        - Typo/formatting
        - Examples/API needed
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: Location
      options:
        - README
        - app README
        - docker docs
        - Code comments
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong / what's needed
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      placeholder: "(optional)"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Searched for duplicates
          required: true
