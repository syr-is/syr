name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs Actual
      placeholder: What should happen vs what actually happens
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (no Docker)
        - Docker dev
        - Docker prod
        - Other
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      placeholder: OS, Node version, browser (if applicable)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      placeholder: "(optional)"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Searched for duplicates
          required: true
