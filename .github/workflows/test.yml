name: Tests

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      crypto: ${{ steps.filter.outputs.crypto }}
      did: ${{ steps.filter.outputs.did }}
      resolver: ${{ steps.filter.outputs.resolver }}
      types: ${{ steps.filter.outputs.types }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            crypto:
              - 'packages/crypto/**'
            did:
              - 'packages/did/**'
              - 'packages/crypto/**'
            resolver:
              - 'packages/resolver/**'
              - 'packages/crypto/**'
              - 'packages/did/**'
            types:
              - 'packages/types/**'

  test-crypto:
    name: "Test: @syr-is/crypto"
    needs: detect-changes
    if: needs.detect-changes.outputs.crypto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @syr-is/crypto build
      - run: pnpm --filter @syr-is/crypto test

  test-did:
    name: "Test: @syr-is/did"
    needs: detect-changes
    if: needs.detect-changes.outputs.did == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @syr-is/crypto build && pnpm --filter @syr-is/did build
      - run: pnpm --filter @syr-is/did test

  test-resolver:
    name: "Test: @syr-is/resolver"
    needs: detect-changes
    if: needs.detect-changes.outputs.resolver == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @syr-is/crypto build && pnpm --filter @syr-is/did build && pnpm --filter @syr-is/resolver build
      - run: pnpm --filter @syr-is/resolver test

  test-types:
    name: "Test: @syr-is/types"
    needs: detect-changes
    if: needs.detect-changes.outputs.types == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @syr-is/types build
      - run: pnpm --filter @syr-is/types test
