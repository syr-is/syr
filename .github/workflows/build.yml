name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Run pnpm build
        run: pnpm exec turbo build --affected
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'origin/main' || github.event.before) }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .turbo
            packages/types/dist
            packages/ui/dist
            packages/ui/.svelte-kit
            packages/crypto/dist
            packages/did/dist
            packages/resolver/dist
            apps/syr/app/.svelte-kit
            apps/syr/app/build
            apps/docs/app/.svelte-kit
            apps/docs/app/dist
            apps/registry/client/.svelte-kit
          include-hidden-files: true
          if-no-files-found: ignore
