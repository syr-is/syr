name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/ts/types/dist
            packages/ts/ui/dist
          key: ${{ runner.os }}-turbo-${{ hashFiles('packages/**/*.ts', 'packages/**/*.svelte', 'packages/**/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('packages/**/*.ts', 'packages/**/*.svelte', 'packages/**/tsconfig.json') }}-
      - run: pnpm lint

  rust-format:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - run: sh scripts/cargo-format-check.sh

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/rust
            apps/syner/app/src-tauri
      - run: sh scripts/cargo-clippy.sh

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'origin/main' || github.event.before) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/ts/types/dist
            packages/ts/ui/dist
            packages/ts/crypto/dist
            packages/ts/did/dist
            packages/ts/resolver/dist
            packages/ts/ui/.svelte-kit
            apps/syr/app/.svelte-kit
            apps/docs/app/.svelte-kit
            apps/registry/client/.svelte-kit
          key: ${{ runner.os }}-turbo-check-${{ hashFiles('pnpm-lock.yaml', 'packages/**/*.ts', 'packages/**/*.svelte', 'apps/**/*.ts', 'apps/**/*.svelte', '**/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-${{ hashFiles('pnpm-lock.yaml', 'packages/**/*.ts', 'packages/**/*.svelte', 'apps/**/*.ts', 'apps/**/*.svelte', '**/tsconfig.json') }}-
      - run: pnpm check

