name: Publish Docs

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

# Only run when the Build workflow succeeded
jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if docs dist exists
        id: check
        run: |
          if [ -d "apps/docs/app/dist" ] && [ -n "$(ls -A apps/docs/app/dist 2>/dev/null)" ]; then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
            echo "Docs were not rebuilt in this run, skipping deploy."
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/app/dist

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.built == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
