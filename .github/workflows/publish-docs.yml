name: Publish Docs

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build workflow run ID to use (default: latest successful)'
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Resolve build run ID
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.build_run_id }}" ]; then
              echo "run_id=${{ inputs.build_run_id }}" >> $GITHUB_OUTPUT
            else
              RUN_ID=$(gh run list --workflow=build.yml --branch=main --status=success --limit=1 --json=databaseId -q '.[0].databaseId')
              if [ -z "$RUN_ID" ]; then
                echo "::error::No successful Build run found. Run the Build workflow first (use 'Force full build' for fresh docs)."
                exit 1
              fi
              echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
            fi
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if docs dist exists
        id: check
        run: |
          if [ -d "apps/docs/app/dist" ] && [ -n "$(ls -A apps/docs/app/dist 2>/dev/null)" ]; then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
            echo "Docs were not rebuilt in this run, skipping deploy."
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/app/dist

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.built == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
