name: 'Setup env'
description: 'Set Turbo env vars (TURBO_TEAM, TURBO_TOKEN, TURBO_SCM_BASE) for remote cache and --affected'
runs:
  using: 'composite'
  steps:
    - name: Set Turbo env
      shell: bash
      run: |
        echo "TURBO_TEAM=${{ vars.TURBO_TEAM }}" >> "$GITHUB_ENV"
        echo "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}" >> "$GITHUB_ENV"
        echo "TURBO_SCM_BASE=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'origin/main' || github.event.before) }}" >> "$GITHUB_ENV"
